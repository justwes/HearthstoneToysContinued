name: Package and release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build preview ZIP without publishing
        if: github.event_name == 'workflow_dispatch'
        uses: BigWigsMods/packager@v2
        with:
          args: -d

      - name: Verify release environment
        if: github.event_name == 'push'
        env:
          GH_API_TOKEN: ${{ github.token }}
        run: |
          echo "Release tag: $GITHUB_REF_NAME"
          echo "Repository: $GITHUB_REPOSITORY"

          if [ -n "$GH_API_TOKEN" ]; then
            echo "GitHub token: Present"
          else
            echo "::error::GitHub token is missing"
            exit 1
          fi

          echo "Tags pointing at HEAD:"
          git tag --points-at HEAD

      - name: Publish tagged release
        if: github.event_name == 'push'
        uses: BigWigsMods/packager@v2
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          GH_API_TOKEN: ${{ github.token }}

      - name: Save ZIP for download
        uses: actions/upload-artifact@v4
        with:
          name: HearthstoneToysContinued-package
          path: .release/*.zip
          include-hidden-files: true
          if-no-files-found: error
